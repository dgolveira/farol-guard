name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could farol-guard help? Mention security impact if it touches keys or remote commands.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
