name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: build
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOARCH=$arch go build -trimpath -o dist/farol-linux-$arch ./cmd/farol
          done
      - name: package
        run: |
          scripts/build-deb.sh --version "$(cat VERSION)" --arch amd64
          dpkg-deb -I dist/farol-guard_*_amd64.deb

  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S error internal/collect/collect.sh internal/keyops/keyops.sh scripts/*.sh test/lab/*.sh
