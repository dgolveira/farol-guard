name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: build
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOARCH=$arch go build -trimpath -o dist/farol-linux-$arch ./cmd/farol
          done
      - name: package
        run: |
          scripts/build-deb.sh --version "$(cat VERSION)" --arch amd64
          dpkg-deb -I dist/farol-guard_*_amd64.deb
          for arch in amd64 arm64; do
            install -Dm755 dist/farol-linux-$arch dist/nfpm/farol
            for kind in rpm archlinux; do
              docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src -e FAROL_ARCH=$arch -e FAROL_VERSION="$(cat VERSION)" \
                docker.io/goreleaser/nfpm:v2.47.0 package -f packaging/nfpm/nfpm.yaml -p $kind -t dist/
            done
          done
          rm -rf dist/nfpm
          ls -l dist/*.rpm dist/*.pkg.tar.zst

  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -S error internal/collect/collect.sh internal/keyops/keyops.sh scripts/*.sh test/lab/*.sh
