name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: test
        run: go test ./...
      - name: build binaries
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${{ steps.v.outputs.version }}" \
              -o dist/farol-linux-$arch ./cmd/farol
          done
      - name: build .deb
        run: |
          scripts/build-deb.sh --version "${{ steps.v.outputs.version }}" --arch amd64
          scripts/build-deb.sh --version "${{ steps.v.outputs.version }}" --arch arm64
      - name: checksums
        run: cd dist && sha256sum farol-linux-* farol-guard_*.deb > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/farol-linux-amd64
            dist/farol-linux-arm64
            dist/farol-guard_*.deb
            dist/SHA256SUMS

  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=Agentless SSH auditor for Debian and Ubuntu server fleets
