    image: farol-lab:mint22
    ports: ["127.0.0.1:2204:22"]
    volumes:
      - ../../.cache/lab/authorized_keys:/lab/authorized_keys:ro
      - ./os-release.mint22:/usr/lib/os-release:ro
  rocky9:
