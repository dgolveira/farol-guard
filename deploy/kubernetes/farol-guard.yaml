apiVersion: v1
kind: Namespace
metadata:
  name: farol-guard
---
apiVersion: v1
kind: Secret
metadata:
  name: farol-guard-env
  namespace: farol-guard
type: Opaque
stringData:
  FAROL_GUARD_TOKEN: change-me-with-openssl-rand-hex-24
  FAROL_GUARD_APP_PASSPHRASE: change-me-with-openssl-rand-base64-32
  FAROL_GUARD_ALLOWED_HOSTS: farol.example.com
---
apiVersion: v1
kind: Secret
metadata:
  name: farol-guard-ssh
  namespace: farol-guard
type: Opaque
stringData:
  id_ed25519: |
    -----PASTE THE PRIVATE KEY USED TO LOG IN TO THE HOSTS-----
  id_ed25519.pub: ssh-ed25519 AAAA... replace-me
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: farol-guard-state
  namespace: farol-guard
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: farol-guard
  namespace: farol-guard
  labels:
    app.kubernetes.io/name: farol-guard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: farol-guard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: farol-guard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: farol-guard
          image: ghcr.io/dgolveira/farol-guard:1.0.1
          args: ["ui", "--no-open", "--listen", "0.0.0.0:7380"]
          envFrom:
            - secretRef:
                name: farol-guard-env
          env:
            - name: XDG_CONFIG_HOME
              value: /state/config
            - name: FAROL_GUARD_DATA
              value: /state/data
            - name: XDG_CACHE_HOME
              value: /state/cache
            - name: FAROL_GUARD_KNOWN_HOSTS
              value: /state/config/known_hosts
          ports:
            - name: http
              containerPort: 7380
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /state
            - name: ssh
              mountPath: /home/farol/.ssh
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: farol-guard-state
        - name: ssh
          secret:
            secretName: farol-guard-ssh
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: farol-guard
  namespace: farol-guard
spec:
  selector:
    app.kubernetes.io/name: farol-guard
  ports:
    - name: http
      port: 7380
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: farol-guard
  namespace: farol-guard
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "https://$host/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://$host/oauth2/start?rd=$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-Email"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["farol.example.com"]
      secretName: farol-guard-tls
  rules:
    - host: farol.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: farol-guard
                port:
                  name: http
